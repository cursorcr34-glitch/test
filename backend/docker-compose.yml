services:
  postgres:
    image: postgres:16-alpine
    container_name: emlak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: emlak
    ports:
      - "5432:5432"
    volumes:
      - emlak_pg_data:/var/lib/postgresql/data

volumes:
  emlak_pg_data:
