services:
  postgres:
    image: postgres:16-alpine
    container_name: rentacar-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rentacar
      POSTGRES_PASSWORD: rentacar
      POSTGRES_DB: rentacar
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentacar -d rentacar"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
